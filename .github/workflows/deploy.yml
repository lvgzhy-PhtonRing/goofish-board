name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Create cloud-config.json from secret (whitelist only)
        env:
          CLOUD_CONFIG_JSON: ${{ secrets.CLOUD_CONFIG_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          if (!process.env.CLOUD_CONFIG_JSON) throw new Error('CLOUD_CONFIG_JSON secret is required')
          const raw = JSON.parse(process.env.CLOUD_CONFIG_JSON)
          const supabaseUrl = String(raw.supabaseUrl || raw.url || '').trim()
          const key = String(raw.publishableKey || raw.supabaseAnonKey || raw.anonKey || '').trim()
          let role
          try { role = JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role } catch {}
          if (!supabaseUrl) throw new Error('supabaseUrl is required')
          if (!key.startsWith('sb_publishable_') && role !== 'anon') throw new Error('Cloud config requires a public Supabase key')
          // 白名单重建：任何多余字段（如 service key）都不会进入公开产物
          fs.writeFileSync('public/cloud-config.json', JSON.stringify({ supabaseUrl, publishableKey: key }))
          NODE

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert public config contains only publishable fields
        run: |
          node -e "const c=require('./dist/cloud-config.json');const k=Object.keys(c).sort().join();if(k!=='publishableKey,supabaseUrl'){console.error('unexpected keys:',k);process.exit(1)}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
